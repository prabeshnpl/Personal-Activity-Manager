# 1. Name of your pipeline
name: App CI/CD Pipeline

# 2. The Trigger Event: Run only when code is pushed to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Continuous Integration (Testing)
  run-tests:
    runs-on: ubuntu-latest # Tells GitHub to give us a fresh Ubuntu machine
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6 # An official action that clones your code onto the runner

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          # 'uses' is like calling a programming function, 'with' is how you pass arguments/parameters into that function.

      - name: Install App Dependencies
        run: pip install -r Backend/activityTracker/requirements.txt 
        # 'run' command directly runs command inside terminal, 
        # whereas 'uses' uses predefined set of command called actions
        # (foreg: logging into docker can take very long boilerplate commands)

      - name: Run Test Suite
        run: python Backend/activityTracker/manage.py test
        env:
          ENVIRONMENT: testing
          PYTHONPATH: Backend/activityTracker
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

  # JOB 2: Continuous Deployment (Build & Ship)
  build-and-ship:
    runs-on: ubuntu-latest
    needs: run-tests # Crucial: Don't run this job unless 'run-tests' passes successfully!
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3 # Uses GitHub's official Docker login tool
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Automatically grabs your GitHub username
          password: ${{ secrets.GITHUB_TOKEN }} # An automated, temporary password given by GitHub

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          FIREBASE_SERVICE_ACCOUNT_KEY=${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          DEBUG="False"
          EOF

      - name: Create .env.frontend file
        run: |
          cat > .env.frontend << EOF
          VITE_API_HOST_URL=${{ secrets.VITE_API_HOST_URL }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENTS_ID=${{ secrets.VITE_FIREBASE_MEASUREMENTS_ID }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Backend/activityTracker/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tracker-backend:latest
            ghcr.io/${{ github.repository_owner }}/tracker-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./FrontEnd/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tracker-frontend:latest
            ghcr.io/${{ github.repository_owner }}/tracker-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
