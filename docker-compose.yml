services:
  api:
    build:
      context: .
      dockerfile: ./Backend/activityTracker/Dockerfile
    ports:
      - 8000:8000
    command: ["sh", "/app/wsgi-entrypoint.sh"]
    depends_on:
      postgres-db:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
        required: true
    volumes:
      - ./Backend/activityTracker/staticfiles:/vol/web/static
    networks:
      - my-network
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: ./FrontEnd/Dockerfile
    depends_on:
      - api
    networks:
      - my-network
    env_file:
      - .env.frontend

  postgres-db:
    image: postgres:18
    restart: unless-stopped
    container_name: "${DB_HOST}"
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - ${DB_PORT}:5432
    networks:
      - my-network
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - my-network

volumes:
  postgres_data:
    name: postgres_data

networks:
  my-network:
    name: my-network
